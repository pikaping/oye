name: corpus-validate

on:
  pull_request:
    paths:
      - "corpus/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/corpus-validate.yml"
  push:
    branches: [main]
    paths:
      - "corpus/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/corpus-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev]
      - name: Validate corpus (strict)
        run: python -m corpus.validate --strict corpus/data
      - name: Run tests
        run: pytest
