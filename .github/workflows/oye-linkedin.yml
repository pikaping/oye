name: Oye · post de LinkedIn

on:
  schedule:
    - cron: "30 8 * * 2"   # martes, 08:30 UTC (09:30 en España en invierno)
  workflow_dispatch:

concurrency:
  group: oye-linkedin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publicar el post de hoy
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
        run: python scripts/publish_linkedin.py

      - name: Guardar el estado del post
        run: |
          git config user.name "oye-bot"
          git config user.email "oye-bot@users.noreply.github.com"
          git add posts/
          if ! git diff --cached --quiet; then
            git commit -m "docs(posts): mark $(date +%F) as published"
            git pull --rebase
            git push
          fi

      - name: Avisar si falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "El post de LinkedIn del $(date +%F) no se ha publicado" \
            --body "Revisa el log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Si el error es 401, el token ha caducado: ejecuta scripts/linkedin_auth.py y actualiza el secreto LINKEDIN_TOKEN."
